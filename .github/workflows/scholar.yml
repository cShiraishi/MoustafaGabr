name: Sync Google Scholar

# Refreshes data/scholar-snapshot.json weekly. GitHub runners are usually able to
# read Scholar directly; if a SERPAPI_API_KEY secret is present it is used first.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh the Scholar snapshot
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          NEXT_PUBLIC_SCHOLAR_ID: hw7IDDoAAAAJ
        run: node scripts/sync-scholar.mjs

      - name: Commit if it changed
        run: |
          if [[ -n "$(git status --porcelain data/scholar-snapshot.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/scholar-snapshot.json
            git commit -m "chore: refresh Google Scholar snapshot"
            git push
          else
            echo "snapshot unchanged"
          fi
